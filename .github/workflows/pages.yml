name: Λletheia • Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - index.html
      - docs.html
      - academy.html
      - playground.html
      - research.html
      - assets/**
      - library/**
      - scripts/**
      - styles/**
      - docs/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish current website source to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate RC1 documentation, Academy and unchanged visual assets
        run: |
          for js in scripts/site.js scripts/docs.js scripts/academy.js scripts/research.js scripts/home.js scripts/playground.js; do
            node --check "$js"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          pages = ['index.html','docs.html','academy.html','research.html','playground.html']
          scripts = [str(x) for x in Path('scripts').glob('*.js')]
          for path in pages + scripts:
              data = Path(path).read_text(encoding='utf-8')
              assert not re.search(r'v0[.]8|Rev8|REV8', data), f'outdated revision reference: {path}'
          assert not Path('library/Aletheia-Marco-Zero-v0.8.pdf').exists()
          assert 'id:\'rc1\'' in Path('scripts/docs.js').read_text()
          assert 'scripts/academy.js' in Path('academy.html').read_text()
          assert 'href="academy.html"' in Path('index.html').read_text()
          assert 's.authorizes' in Path('scripts/docs.js').read_text()
          print('RC1 and Academy validation passed; legacy revision absent in served content.')
          PY
      - name: Prepare static deployment
        run: |
          mkdir -p _site
          cp index.html docs.html academy.html playground.html research.html _site/
          cp -R assets styles scripts library _site/
          touch _site/.nojekyll
          test -s _site/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
