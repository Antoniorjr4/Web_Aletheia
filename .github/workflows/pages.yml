name: Λletheia • Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - deployment/Aletheia_Website_V0.0.zip
      - .github/workflows/pages.yml
      - index.html
      - docs.html
      - playground.html
      - research.html
      - assets/**
      - library/**
      - scripts/**
      - styles/**
      - docs/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish current website source to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare static deployment
        run: |
          mkdir -p _site
          cp index.html docs.html playground.html research.html _site/
          cp -R assets styles scripts library _site/
          touch _site/.nojekyll
          test -s _site/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
