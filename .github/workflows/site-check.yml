name: Λletheia Website · RC1 Academy QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [site-rc1-academy]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate JavaScript syntax
        run: |
          for js in scripts/*.js; do node --check "$js"; done
      - name: Check links, revision labels and bilingual Academy
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links=[]
                  self.ids=set()
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  if 'id' in d: self.ids.add(d['id'])
                  for key in ('href','src'):
                      if key in d: self.links.append(d[key])
          pages=['index.html','docs.html','academy.html','research.html','playground.html']
          for fn in pages:
              s=Path(fn).read_text(encoding='utf-8')
              assert not re.search(r'v0[.]8|Rev8|REV8',s), f'stale site revision: {fn}'
              p=Links(); p.feed(s)
              for link in p.links:
                  if not link or link.startswith(('#','https://','http://','mailto:','javascript:')): continue
                  target=Path(link.split('#')[0].split('?')[0])
                  assert target.is_file(), f'{fn}: broken relative link {link}'
          for js in Path('scripts').glob('*.js'):
              assert not re.search(r'v0[.]8|Rev8|REV8',js.read_text()), f'stale script revision: {js}'
          assert not Path('library/Aletheia-Marco-Zero-v0.8.pdf').exists()
          assert not Path('deployment/Aletheia_Website_V0.0.zip').exists()
          docs=Path('scripts/docs.js').read_text()
          site=Path('scripts/site.js').read_text()
          academy=Path('scripts/academy.js').read_text()
          assert "id:'rc1'" in docs
          assert 'navAcademy:' in site and 'scripts/academy.js' in Path('academy.html').read_text()
          assert "release/v1.0-rc1" in docs and "s.authorizes" in docs
          assert 'getLesson' in academy and 'academy-feedback' in academy
          assert 'localStorage' in academy and 'querySelector' in academy
          print('5 pages, JS syntax, anchors, Academy and RC1 sources: OK')
          PY
      - name: Ensure unchanged stylesheet and branding assets
        run: |
          git fetch origin main
          if [ -n "$(git diff --name-only origin/main...HEAD -- styles/ assets/)" ]; then
            echo "::error::visual design files modified"; exit 1
          fi
          echo 'No CSS/logo/image design changes.'
